<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกแต้มจูบ</title>
    <style>
        body { font-family: sans-serif; background: #fce4ec; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-add { background: #d81b60; color: white; font-weight: bold; cursor: pointer; }
        .log-item { background: #fff5f8; padding: 10px; margin: 10px 0; border-left: 5px solid #d81b60; border-radius: 5px; }
        .log-img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>บันทึกหลักฐานคำหยาบ</h2>
    <input type="text" id="cussWord" placeholder="แฟนพูดคำว่าอะไร...">
    <input type="file" id="imageInput" accept="image/*">
    <button class="btn-add" onclick="saveRecord()">บันทึกหลักฐาน (จูบเพิ่ม!)</button>
    <hr>
    <h3>แต้มรวมตอนนี้: <span id="total">0</span> นาที</h3>
    <div id="logContainer"></div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('myCussRecords')) || [];

    function saveRecord() {
        const word = document.getElementById('cussWord').value;
        const fileInput = document.getElementById('imageInput');
        
        if (!word) { alert("ใส่คำหยาบก่อนเพื่อน!"); return; }

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                addRecord(word, e.target.result);
            }
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            addRecord(word, null);
        }
    }

    function addRecord(word, imgData) {
        const now = new Date();
        const timeStr = now.toLocaleDateString('th-TH') + " " + now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
        records.push({ word, imgData, time: timeStr });
        localStorage.setItem('myCussRecords', JSON.stringify(records));
        location.reload();
    }

    // โหลดข้อมูล
    const container = document.getElementById('logContainer');
    document.getElementById('total').innerText = records.length;
    records.slice().reverse().forEach(r => {
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `<strong>คำ: ${r.word}</strong><br><small>${r.time}</small>
                         ${r.imgData ? `<br><img src="${r.imgData}" class="log-img">` : ''}`;
        container.appendChild(div);
    });
</script>

</body>
</html>
